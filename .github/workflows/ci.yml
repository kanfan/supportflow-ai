name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPPORTFLOW_TEST_DATABASE_URL: postgresql+psycopg://supportflow:supportflow@127.0.0.1:5432/supportflow_test

    services:
      postgres:
        image: pgvector/pgvector:0.8.5-pg17-bookworm
        env:
          POSTGRES_DB: supportflow_test
          POSTGRES_USER: supportflow
          POSTGRES_PASSWORD: supportflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supportflow -d supportflow_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install

      - name: Verify lockfile
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run pyright

      - name: Run tests
        run: uv run pytest

  container-smoke:
    name: Container smoke test
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Start local stack
        run: docker compose up --detach --build --wait --wait-timeout 180

      - name: Verify database migration round trip
        run: |
          docker compose run --rm api alembic upgrade head
          docker compose run --rm api alembic check
          docker compose run --rm api alembic downgrade base
          docker compose run --rm api alembic upgrade head

      - name: Check API
        run: curl --fail --show-error http://127.0.0.1:8000/health/live

      - name: Check worker queue round trip
        run: docker compose run --rm api python -m scripts.smoke_worker

      - name: Check document ingestion round trip
        run: docker compose run --rm api python -m scripts.smoke_document_ingestion

      - name: Check claimed-job worker-loss redelivery
        run: |
          docker compose -f compose.yaml -f compose.worker-loss.yaml up --detach --force-recreate --wait --wait-timeout 180 worker
          docker compose run --rm api python -m scripts.smoke_worker_redelivery prepare
          docker compose -f compose.yaml -f compose.worker-loss.yaml kill --signal SIGKILL worker
          docker compose run --rm api python -m scripts.smoke_worker_redelivery release
          # Ensure the five-second test visibility lease has expired before the
          # replacement worker performs its initial Redis restore scan.
          sleep 6
          docker compose -f compose.yaml -f compose.worker-loss.yaml up --detach --force-recreate --wait --wait-timeout 180 worker
          docker compose run --rm api python -m scripts.smoke_worker_redelivery verify

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop local stack
        if: always()
        run: docker compose down --volumes --remove-orphans
